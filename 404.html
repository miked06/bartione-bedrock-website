<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not found — Baritone Bedrock</title>
  <link rel="icon" href="/bartione-bedrock-website/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@500&family=Pixelify+Sans:wght@700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0b1016; --text: #e8eef5; --muted: #8b98a9; --green: #45e07a; --red: #ff4d57; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 16px/1.6 Inter, system-ui, sans-serif; padding: 24px; }
    main { text-align: center; max-width: 520px; }
    h1 { font: 700 clamp(64px, 16vw, 120px)/1 "Pixelify Sans", Inter, sans-serif; margin: 0 0 8px; color: var(--green); text-shadow: 0 6px 0 rgba(0, 0, 0, 0.35); }
    .chat { display: inline-block; margin: 18px 0 26px; padding: 10px 16px; background: rgba(0, 0, 0, 0.55); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 6px; font: 500 15px "JetBrains Mono", monospace; text-align: left; }
    .chat span { display: block; }
    .p { color: #d16cff; }
    .e { color: var(--red); }
    a { display: inline-block; padding: 12px 20px; border-radius: 10px; background: linear-gradient(180deg, #5df08f, #2fc463); color: #062312; font-weight: 600; text-decoration: none; }
    p { color: var(--muted); margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>This block does not exist.</p>
    <div class="chat">
      <span><span class="p">[Baritone]</span> &gt; goto this_page</span>
      <span><span class="p">[Baritone]</span> <span class="e">No path found</span></span>
    </div>
    <br>
    <a href="/bartione-bedrock-website/">#home</a>
  </main>
</body>
</html>
